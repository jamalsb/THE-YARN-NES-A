name: Auto Generate HTML Blog Post

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yarn-nest-auto-blog
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai requests

      - name: Generate Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate_post.py

      - name: Commit and Push
        run: |
          git config user.name "YarnNest Bot"
          git config user.email "bot@yarnnest.local"
          git add blog.html sitemap.xml post-*.html images/ .cache/ keyword_history.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add automatically generated crochet blog post"
          git push
