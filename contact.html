<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | The Yarn Nest</title>
  <meta name="description" content="Contact The Yarn Nest with questions, feedback, or collaboration inquiries about crochet, knitting, and yarn projects." />
  <link rel="canonical" href="https://www.theyarnnest.shop/contact.html" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZT8H6KLQH6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZT8H6KLQH6');
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🧶</span>
        <span class="logo-text">The Yarn <span>Nest</span></span>
      </a>
      <nav class="nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#deals">Deals</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:60px 20px;max-width:640px;">
    <h1 style="font-family:'Playfair Display',serif;font-size:40px;margin-bottom:10px;">Get in Touch 💌</h1>
    <p style="color:var(--muted);margin-bottom:30px;">
      Have a question, want to submit a deal, or interested in partnering with us? Drop us a message!
    </p>
    <form id="contactForm" style="display:flex;flex-direction:column;gap:14px;">
      <input type="text" placeholder="Your Name" required
        style="padding:14px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit;font-size:15px;outline:none;" />
      <input type="email" placeholder="Your Email" required
        style="padding:14px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit;font-size:15px;outline:none;" />
      <textarea placeholder="Your Message" rows="6" required
        style="padding:14px 18px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit;font-size:15px;outline:none;resize:vertical;"></textarea>
      <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Send Message →</button>
    </form>
    <p id="contactMsg" style="margin-top:20px;color:var(--primary);font-weight:600;"></p>
  </main>

  <footer class="footer" style="margin-top:60px;">
    <div class="footer-bottom container">
      <p>© <span id="year"></span> The Yarn Nest. All rights reserved.</p>
    </div>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('contactForm').addEventListener('submit', e => {
      e.preventDefault();
      document.getElementById('contactMsg').textContent = '✅ Message sent! We\'ll get back to you soon.';
      e.target.reset();
    });
  </script>
</body>
  </html>
